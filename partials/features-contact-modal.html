<div class="modal-backdrop" id="modal-backdrop" aria-hidden="true">
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="ms-dots" id="ms-dots">
        <span class="ms-dot" data-dot="1"></span>
        <span class="ms-dot" data-dot="2"></span>
        <span class="ms-dot" data-dot="3"></span>
      </div>
      <div class="ms-step" id="ms-step-1">
        <span class="modal-eyebrow">Get Started</span>
        <h2 class="ms-headline">What's your name?</h2>
        <div class="form-group">
          <input type="text" id="ms-name" placeholder="Jane Smith" autocomplete="name">
        </div>
        <button class="btn-primary ms-next-btn" id="ms-next-1">Next <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
      </div>
      <div class="ms-step ms-step--hidden" id="ms-step-2">
        <span class="modal-eyebrow">Get Started</span>
        <h2 class="ms-headline">Great <span id="ms-name-display"></span>. Now let's grab your info.</h2>
        <div class="form-group">
          <input type="email" id="ms-email" placeholder="jane@dealership.com" autocomplete="email">
        </div>
        <div class="form-group">
          <input type="tel" id="ms-phone" placeholder="+1 (555) 000-0000" autocomplete="tel">
        </div>
        <button class="btn-primary ms-next-btn" id="ms-next-2">Next <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
      </div>
      <div class="ms-step ms-step--hidden" id="ms-step-3">
        <span class="modal-eyebrow">Get Started</span>
        <h2 class="ms-headline">Do you want to schedule a time on our calendar to chat?</h2>
        <div class="ms-choice-row">
          <button class="ms-choice ms-choice--yes" id="ms-yes">Yes, let's book a time</button>
          <button class="ms-choice ms-choice--no" id="ms-no">No, just reach out</button>
        </div>
      </div>
      <div class="ms-step ms-step--hidden" id="ms-step-4">
        <span class="modal-eyebrow">Pick a Time</span>
        <h2 class="ms-headline">Choose a date.</h2>
        <div class="ms-calendar" id="ms-calendar"></div>
        <div class="ms-times" id="ms-times"></div>
      </div>
      <div class="ms-step ms-step--hidden" id="ms-step-5">
        <div class="ms-confirm">
          <div class="ms-confirm-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <h2 class="ms-confirm-title">You're all set!</h2>
          <p class="ms-confirm-text" id="ms-confirm-text"></p>
          <button class="btn-primary ms-next-btn" id="ms-done">Done</button>
        </div>
      </div>
    </div>
  </div>
